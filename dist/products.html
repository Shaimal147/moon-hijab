<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#192f3b">
    <meta name="description"
        content="Browse and filter the Moon Hijab collection: niqabs, hijabs, khimars, abayas and jilbabs.">
    <title>The collection | Moon Hijab</title>
    <link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/brand.css">
    <script defer src="assets/vendor/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/js/app.js"></script>
</head>

<body data-page="products">
    <header id="site-header" class="site-header"></header><noscript>
        <div class="container py-4">Please enable JavaScript to browse the catalogue and configure products. <a
                href="index.html">Home</a> · <a href="products.html">Products</a> · <a href="contact.html">Contact</a>
        </div>
    </noscript>
    <main id="main">
        <div class="container section-space">
            <header class="row align-items-end gy-3 mb-4">
                <div class="col-md-7">
                    <p class="eyebrow mb-3">Moon Hijab / Products</p>
                    <h1 class="page-title mb-3">The collection.</h1>
                    <p class="text-secondary mb-0">Choose a style. Make it yours.</p>
                </div>
                <div class="col-md-5 col-lg-4 ms-auto"><label class="form-label small" for="product-search">Find a
                        product</label><input id="product-search" class="form-control" type="search"
                        placeholder="Search by name…" autocomplete="off"></div>
            </header>
            <div class="d-flex flex-wrap gap-2 pt-3 pb-4 border-bottom" id="category-filters" role="group"
                aria-label="Filter products by category"></div>
            <div class="d-flex justify-content-between flex-wrap gap-2 py-4">
                <p class="small text-secondary mb-0" id="product-count" role="status"></p>
                <p class="small text-secondary mb-0">Prices in MVR · Options on each product page</p>
            </div>
            <div class="row g-3 g-md-4 gy-5" id="product-grid"></div>
        </div>
    </main>
    <footer id="site-footer" class="site-footer border-top"></footer>
</body>

</html>
